name: Release

# Pushing a tag v<version> publishes the packages at that version, which must be the one of their package.json. A
# version already on npm is skipped, so the workflow can run again after a failure.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Versions match the tag
        run: |
          for name in $(bun -e 'import { published } from "./scripts/published.ts"; console.log(published.join(" "))'); do
            version=$(jq -r .version "packages/$name/package.json")
            test "v$version" = "$GITHUB_REF_NAME" || { echo "@p9s/$name is $version, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Pack and check the tarballs
        run: bun run pack:check
      - name: Publish
        run: |
          for name in $(bun -e 'import { published } from "./scripts/published.ts"; console.log(published.join(" "))'); do
            version=$(jq -r .version "packages/$name/package.json")
            if npm view "@p9s/$name@$version" version >/dev/null 2>&1; then
              echo "@p9s/$name@$version is already published"
            else
              npm publish "packed/p9s-$name-$version.tgz" --provenance --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # PyPI trusts this workflow, with trusted publishing: no token
  publish-python:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "p9s is $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  # RubyGems trusts this workflow, with trusted publishing: the role it assumes is the variable RUBYGEMS_ROLE
  publish-ruby:
    runs-on: ubuntu-latest
    environment: rubygems
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Version matches the tag
        run: |
          version=$(ruby -r ./lib/p9s/version -e 'print P9s::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "p9s is $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
        with:
          role-to-assume: ${{ vars.RUBYGEMS_ROLE }}
      - name: Publish
        run: |
          gem build p9s.gemspec
          version=$(ruby -r ./lib/p9s/version -e 'print P9s::VERSION')
          if gem list --remote --exact --all p9s | grep -q "[( ]$version[,)]"; then
            echo "p9s $version is already published"
          else
            gem push "p9s-$version.gem"
          fi

  # A Go module in a folder takes its versions from tags with the folder as prefix
  tag-go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag packages/go
        run: |
          tag="packages/go/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  # crates.io trusts this workflow, with trusted publishing: no token
  publish-rust:
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "p9s is $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/p9s/$version" -A "p9s release" >/dev/null; then
            echo "p9s $version is already published"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
