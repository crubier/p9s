name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Example app typecheck and lint
        run: bun run typecheck && bun run lint
        working-directory: examples/nextjs-drizzle
      - name: PostGraphile example typecheck
        run: bun run typecheck
        working-directory: examples/postgraphile
      - name: Tests on PGlite
        run: bun run test
      - name: Tests on Postgres
        run: bun run test
        env:
          P9S_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Benchmark smoke run
        run: bun run bench --url "$DATABASE_URL" --sizes 4 --reps 3 --warmup 1 --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results
