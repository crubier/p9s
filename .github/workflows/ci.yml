name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Packages install and run from their tarballs, as from npm
        run: bun run pack:check
      - name: Example app typecheck and lint
        run: bun run typecheck && bun run lint
        working-directory: examples/nextjs-drizzle
      - name: PostGraphile example typecheck, generated types and build
        run: bun run typecheck && bun run codegen && git diff --exit-code web/gql && bun run build
        working-directory: examples/postgraphile
      - name: Tests on PGlite
        run: bun run test:each
      - name: The database of the conformance suite, see packages/conformance
        run: bun packages/conformance/prepare.ts
        env:
          P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
      - name: Tests on Postgres
        run: bun run test:each
        env:
          P9S_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
      - name: Postgres package tests with resourceCache assigned
        run: bun test
        working-directory: packages/postgres
        env:
          P9S_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          P9S_TEST_RESOURCE_CACHE: assigned
      - name: Benchmark smoke run
        run: bun run bench --url "$DATABASE_URL" --sizes 4 --reps 3 --warmup 1 --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results

  # Each example app runs before p9s, adopts it with one command, and runs after p9s, see examples/adoption
  adoption:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [kysely, prisma, supabase, drizzle, postgraphile-rls, fastapi, django, rails, gorm, axum, phoenix, laravel]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - uses: ruby/setup-ruby@v1
        if: matrix.example == 'rails'
        with:
          ruby-version: "3.4"
      - uses: actions/setup-go@v5
        if: matrix.example == 'gorm'
        with:
          go-version-file: examples/gorm/before/go.mod
          cache-dependency-path: examples/gorm/before/go.sum
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.example == 'axum'
      - uses: erlef/setup-beam@v1
        if: matrix.example == 'phoenix'
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: shivammathur/setup-php@v2
        if: matrix.example == 'laravel'
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
          coverage: none
      - name: Adoption of ${{ matrix.example }}
        run: bun test examples/${{ matrix.example }}
        env:
          P9S_ADOPTION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # The Python package, on SQLAlchemy and Django, see packages/python
  python:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest -q
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Builds a wheel and a source distribution
        run: uv build

  # The Ruby gem, on Active Record and Rails controllers, see packages/ruby
  ruby:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rake test
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Builds the gem
        run: gem build p9s.gemspec

  # The Go module, on database/sql, pgx and GORM, see packages/go
  go:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: packages/go/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # The Rust crate, on sqlx and axum, see packages/rust
  rust:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Packages the crate
        run: cargo package --allow-dirty

  # The Elixir package, on Ecto and Phoenix controllers, see packages/elixir
  elixir:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Builds the package
        run: mix hex.build

  # The PHP package, on Laravel and Eloquent, see packages/php
  php:
    runs-on: ubuntu-latest
    env:
      P9S_CONFORMANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p9s_conformance
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: The database of the conformance suite, see packages/conformance
        run: bun install --frozen-lockfile && bun packages/conformance/prepare.ts
        working-directory: .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
        env:
          P9S_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # Runs the base and this revision in turns on the same server and fails when a median got significantly slower, see
  # the Benchmarks page. In parallel with the tests, which take about as long.
  benchmark-ab:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Benchmark against the base, in turns
        run: bun run bench:ab --base "$BASE" --out ab-results --fail
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-ab
          path: |
            ab-results/**/*.json
            ab-results/*.log
