services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18.1
    restart: always
    # Sized for a laptop with >= 8 GB of RAM. The whole dataset fits in shared_buffers, so the benchmark measures
    # CPU work in triggers and policies rather than disk. JIT is off because it only adds compile time to the
    # short OLTP queries measured here. Durability settings are left at their defaults so write latencies stay realistic.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    shm_size: 1gb
    healthcheck:
      test: /usr/bin/pg_isready -U postgres
      interval: 5s
      timeout: 10s
      retries: 3
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
